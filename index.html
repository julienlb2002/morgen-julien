<style>
/* Layout: Story-Player im Hochformat; auf dem Handy bildschirmfüllend, am Desktop zentriert mit Kapitelliste daneben. Bewusst durchgehend dunkle Optik. */
:root {
  --page: #0b0e13; --panel: #141a24; --line: #263040; --fg: #f3f5f8; --muted: #9aa5b5;
  --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; }
p { margin: 0; } h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

.layout { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 220px auto 220px; gap: 28px; justify-content: center; align-items: center; min-height: calc(100% - 0px); }
.side { display: flex; flex-direction: column; gap: 6px; }
.side h2 { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.side button { text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.side button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, #556); flex: none; }
.side button[aria-current="true"] { background: var(--panel); color: var(--fg); }
.side button:hover { color: var(--fg); }
.help { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.help kbd { font-family: var(--sans); font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

.player { position: relative; width: min(100%, 420px); height: min(calc(100vh - 40px), 800px); aspect-ratio: 9 / 16; max-height: 800px; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); background: #111; user-select: none; -webkit-user-select: none; touch-action: pan-y; outline: none; }
.top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: 12px 14px 22px; background: linear-gradient(rgba(0,0,0,.35), transparent); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.bars { display: flex; gap: 4px; }
.bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.3); overflow: hidden; }
.bars i.done { background: #fff; }
.bars i.now { background: linear-gradient(90deg, #fff 50%, rgba(255,255,255,.3) 50%); background-size: 200% 100%; background-position: 0 0; }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
.meta .ch { display: flex; gap: 8px; align-items: center; }
.meta .logo { font-weight: 800; letter-spacing: -.02em; }
.meta .dot { opacity: .6; }
.menu-btn { pointer-events: auto; background: rgba(0,0,0,.28); border: 0; border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; }
.menu-btn svg { width: 18px; height: 18px; }

.slide { position: absolute; inset: 0; padding: 86px 26px 30px; display: flex; flex-direction: column; gap: 16px; color: #fff; }
.slide.end-j { justify-content: flex-end; } .slide.center-j { justify-content: center; }
.k { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.badge { align-self: flex-start; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.18); padding: 5px 10px; border-radius: 999px; }
.num { font-weight: 800; font-size: clamp(64px, 18vw, 92px); line-height: .9; letter-spacing: -.045em; }
.numl { font-size: 15px; font-weight: 600; opacity: .85; margin-top: -6px; max-width: 30ch; }
.h { font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
.h.sm { font-size: 22px; }
.t { font-size: 16.5px; line-height: 1.55; opacity: .93; }
.paras { display: flex; flex-direction: column; gap: 12px; }
.hint { font-size: 12.5px; opacity: .65; }
.logo-big { font-weight: 800; font-size: 72px; line-height: .88; letter-spacing: -.05em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.14); display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.glance { display: flex; flex-direction: column; gap: 14px; }
.glance div { display: grid; grid-template-columns: 10px 1fr; gap: 12px; font-size: 17px; line-height: 1.45; font-weight: 600; }
.glance i { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; }
.light { color: #10161f; }
.light .badge, .light .chip { background: rgba(0,0,0,.08); }
.concepts { display: flex; flex-wrap: wrap; gap: 6px; }
.concepts span { font-size: 12.5px; font-weight: 800; padding: 5px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
.q { font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.3; padding: 14px 16px; border-radius: 14px; background: rgba(0,0,0,.07); }
.src { display: flex; flex-wrap: wrap; gap: 6px; }
.src a { font-size: 13px; font-weight: 700; color: inherit; text-decoration: none; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,.08); position: relative; z-index: 4; }
.src a::after { content: " ↗"; }
.bar-row { display: grid; grid-template-columns: 70px 1fr 40px 40px; gap: 10px; align-items: center; font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.bar-row .tr { height: 12px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar-row .tr b { display: block; height: 100%; border-radius: 99px; }
.bar-row .c { font-size: 12.5px; opacity: .75; text-align: right; }
.bar-row .v { text-align: right; }
.coal { display: flex; flex-direction: column; gap: 14px; }
.coal .top2 { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; font-weight: 700; }
.coal .pill { font-size: 12px; font-weight: 800; white-space: nowrap; }
.coal .ok { color: #6be3a4; } .coal .no { color: #ff8f8f; }
.stack { position: relative; height: 14px; border-radius: 99px; background: rgba(255,255,255,.12); display: flex; overflow: hidden; margin-top: 6px; }
.stack span { height: 100%; }
.stack .half { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; }
.lean-track { position: relative; height: 14px; border-radius: 99px; background: linear-gradient(90deg, #c2334a, rgba(255,255,255,.15) 50%, #3a6bd6); }
.lean-mark { position: absolute; top: -6px; width: 6px; height: 26px; border-radius: 3px; background: #fff; transform: translateX(-3px); box-shadow: 0 0 0 3px rgba(0,0,0,.25); }
.lean-scale { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; opacity: .7; }
.dates { display: flex; flex-direction: column; }
.dates div { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.14); align-items: baseline; font-size: 16px; font-weight: 600; }
.dates .d { font-weight: 800; font-size: 14px; }
.dates .cd { font-size: 12.5px; opacity: .7; white-space: nowrap; }
.endblock { display: flex; flex-direction: column; gap: 8px; }
.endblock h3 { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.mini { display: flex; flex-direction: column; gap: 6px; }
.mini .bar-row { font-size: 13.5px; grid-template-columns: 66px 1fr 36px 34px; }
.mini .bar-row .tr { height: 9px; }
.endblock .dates div { padding: 8px 0; font-size: 14.5px; }
.endclose { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,.18); padding-top: 16px; }
.endclose .h { font-size: 28px; }
.art { position: absolute; left: 0; right: 0; top: 64px; height: 44%; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.art::before { content: ""; position: absolute; width: min(70%, 290px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,0) 70%); }
.art svg { position: relative; width: min(66%, 270px); height: auto; filter: drop-shadow(0 12px 24px rgba(0,0,0,.25)); }
.art .m1 { fill: #fff; } .art .m2 { fill: rgba(255,255,255,.55); } .art .m3 { fill: rgba(255,255,255,.22); } .art .m4 { fill: #ffd23f; } .art .dk { fill: rgba(0,0,0,.2); }
.art .ln { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 3; stroke-linecap: round; }
.cover-art { top: 56px; height: 52%; align-items: flex-end; }
.cover-art::before { display: none; }
.cover-art svg { width: 100%; max-width: none; height: 100%; filter: none; }
.slide > *:not(.art) { position: relative; }
.endslide { justify-content: center; gap: 14px; }
.endtop { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.endtop .h { font-size: 34px; }
.endtop .t { font-size: 15px; opacity: .8; }
.card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.card-h span:last-child { opacity: .6; letter-spacing: .04em; }
.stackbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; }
.stackbar span { height: 100%; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 16px; }
.legend div { display: grid; grid-template-columns: 9px 1fr auto 34px; gap: 7px; align-items: center; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.legend i { width: 9px; height: 9px; border-radius: 50%; }
.legend .n { font-weight: 600; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend b { font-weight: 800; }
.legend .c { font-size: 11.5px; opacity: .6; text-align: right; }
.agenda { display: flex; flex-direction: column; }
.agenda div { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.08); font-size: 14.5px; }
.agenda div:first-child { border-top: 0; padding-top: 0; }
.agenda .d { font-weight: 800; font-size: 13px; }
.agenda .l { font-weight: 600; line-height: 1.3; }
.agenda .cd { font-size: 12px; opacity: .6; }
.endslide .restart { align-self: stretch; text-align: center; margin-top: 4px; }
.restart { position: relative; z-index: 4; align-self: flex-start; background: #fff; color: #10161f; border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 800; cursor: pointer; }
.zone { position: absolute; top: 0; bottom: 0; z-index: 2; }
.zone.l { left: 0; width: 30%; } .zone.r { right: 0; width: 70%; }

.overlay { position: absolute; inset: 0; z-index: 6; background: rgba(8,11,16,.94); padding: 70px 20px 24px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.overlay h2 { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.overlay button.item { text-align: left; background: var(--panel); border: 0; border-radius: 14px; padding: 13px 14px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
.overlay button.item i { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--c); }
.overlay button.item b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.overlay button.item span { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.overlay .close { position: absolute; top: 18px; right: 16px; background: var(--panel); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }

.under { display: none; }
[hidden] { display: none !important; }
@media (max-width: 900px) {
  .layout { grid-template-columns: auto; }
  .side { display: none; }
}
@media (max-width: 520px) {
  body { padding: 0; }
  .layout { display: block; }
  .player { width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; aspect-ratio: auto; box-shadow: none; }
  .slide { padding-top: calc(86px + env(safe-area-inset-top, 0px)); padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
  .top { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: no-preference) {
  .slide.in { animation: fade .28s ease; }
  @keyframes fade { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

      <div class="meta"><span class="ch"><span class="logo">Morgen, Julien</span><span class="dot">·</span><span id="chname"></span></span>
        <button class="menu-btn" id="menu" type="button" aria-label="Kapitelübersicht öffnen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>

<script>
